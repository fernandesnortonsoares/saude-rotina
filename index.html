<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bdb">
<link rel="manifest" href="manifest.json">
<title>Saúde e Rotina</title>
<style>
:root{--bg:#f4f2fb;--card:#fff;--tx:#1f1d2b;--mut:#6b6880;--ac:#5b4bdb;--ac2:#ff7a59;--acl:#ece9ff;--bd:#e6e3f3;--warn:#fff3e6;--wtx:#9a4a12;--dan:#ffe9ec;--dtx:#b3203a;--ok:#1f8a70;
--c1:#ffe4dc;--c1t:#c2410c;--c2:#fff1c9;--c2t:#a16207;--c3:#dbeafe;--c3t:#1d4ed8;--c4:#d5f5f6;--c4t:#0e7490;--c5:#fde2f1;--c5t:#be185d;--c6:#ede4ff;--c6t:#6d28d9;--c7:#fef9c3;--c7t:#a16207;--c8:#e0f2fe;--c8t:#0369a1;--c9:#e8e8ef;--c9t:#3f3f56}
@media (prefers-color-scheme:dark){:root{--bg:#14121f;--card:#1f1c2e;--tx:#f1effa;--mut:#a7a3bd;--ac:#8f82ff;--ac2:#ff9b7f;--acl:#2c2650;--bd:#332f47;--warn:#3a2a17;--wtx:#ffc38a;--dan:#3d1b24;--dtx:#ff9fb0;--ok:#5fd3b0;
--c1:#3d2219;--c1t:#ffb59c;--c2:#3a3016;--c2t:#fcd679;--c3:#1b2a4a;--c3t:#9cc3ff;--c4:#123638;--c4t:#7fe1ea;--c5:#3d1a2e;--c5t:#ff9fd0;--c6:#2c2150;--c6t:#c4b0ff;--c7:#38341a;--c7t:#f5e27a;--c8:#16303f;--c8t:#8fd3ff;--c9:#2a2a38;--c9t:#cfcfe0}}
*{box-sizing:border-box}body{margin:0;font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.5}
header{position:sticky;top:0;background:linear-gradient(120deg,#5b4bdb 0%,#8b5cf6 55%,#ff7a59 120%);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5;box-shadow:0 4px 18px rgba(91,75,219,.25)}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
main{max-width:720px;margin:0 auto;padding:14px 12px 90px}
nav{position:fixed;bottom:10px;left:10px;right:10px;max-width:700px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:20px;display:flex;overflow-x:auto;z-index:5;box-shadow:0 8px 24px rgba(31,29,43,.12);padding:4px}
nav button{flex:1;min-width:66px;border:0;background:none;padding:9px 4px;font-size:12px;color:var(--mut);border-radius:14px;font-family:inherit}
nav button.on{color:#fff;background:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px rgba(31,29,43,.05)}
.card h2{font-size:18px;margin:0 0 8px;font-weight:800}.card h3{font-size:16px;margin:12px 0 6px;color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{display:grid;grid-template-columns:1fr 90px 46px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.it:last-child{border-bottom:0}.plan{font-size:13px;color:var(--mut)}
input,select,textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac)}
button.b{font:inherit;font-weight:700;padding:10px 16px;border-radius:14px;border:0;background:linear-gradient(120deg,var(--ac),#8b5cf6);color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(91,75,219,.25)}
button.s{font:inherit;padding:8px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}
.alert{background:var(--warn);color:var(--wtx);border-radius:14px;padding:11px 13px;margin:0 0 12px;font-size:15px;border-left:5px solid var(--ac2)}
.danger{background:var(--dan);color:var(--dtx);border-left-color:var(--dtx)}
.tag{display:inline-block;background:var(--acl);color:var(--ac);border-radius:20px;padding:3px 11px;font-size:13px;margin:2px;font-weight:700}
.opts label{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 4px 0;font-size:15px;background:var(--bg);border:1px solid var(--bd);padding:5px 10px;border-radius:20px}
.q{margin:0 0 14px}.q>div:first-child{font-weight:700;font-size:15px;margin-bottom:5px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:left}th{color:var(--mut);font-weight:600}
.cnt{display:flex;align-items:center;gap:10px}.cnt b{font-size:24px;min-width:30px;text-align:center;color:var(--ac)}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#1f1d2b;color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;z-index:9;display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
.met{border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;background:var(--c3);color:var(--c3t)}.met .mut{color:inherit;opacity:.85}.met b{font-size:22px}
.met:nth-child(6n+1){background:var(--c1);color:var(--c1t)}.met:nth-child(6n+2){background:var(--c2);color:var(--c2t)}.met:nth-child(6n+3){background:var(--c8);color:var(--c8t)}.met:nth-child(6n+4){background:var(--c5);color:var(--c5t)}.met:nth-child(6n+5){background:var(--c6);color:var(--c6t)}.met:nth-child(6n){background:var(--c4);color:var(--c4t)}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:0;border-radius:18px;padding:16px 14px;font:inherit;cursor:pointer;min-height:104px;box-shadow:0 3px 10px rgba(31,29,43,.06);transition:transform .12s}
.tile:active{transform:scale(.97)}.tile b{font-size:16px}.tile .mut{color:inherit;opacity:.8;font-size:13px}
.tile.k-hoje{background:var(--c1);color:var(--c1t)}.tile.k-plano{background:var(--c2);color:var(--c2t)}.tile.k-avaliacao{background:var(--c3);color:var(--c3t)}.tile.k-exames{background:var(--c4);color:var(--c4t)}
.tile.k-emocional{background:var(--c5);color:var(--c5t)}.tile.k-relatorio{background:var(--c6);color:var(--c6t)}.tile.k-pesquisa{background:var(--c7);color:var(--c7t)}.tile.k-ajuda{background:var(--c8);color:var(--c8t)}.tile.k-admin{background:var(--c9);color:var(--c9t)}
.hero{background:linear-gradient(135deg,#5b4bdb,#8b5cf6 60%,#ff7a59);color:#fff;border:0}.hero .mut{color:#fff;opacity:.85}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
details>summary{cursor:pointer}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header><h1>Saúde e Rotina</h1><span id="hdr" class="mut" style="color:#fff"></span></header>
<main id="app"><div class="card">Carregando…</div></main>
<footer style="max-width:720px;margin:-80px auto 90px;padding:0 12px;font-size:13px;color:var(--mut)"><b>Aviso:</b> o questionário serve para personalizar a rotina e as sugestões. Ele não é diagnóstico e não substitui o médico ou o nutricionista. Mudanças em remédios dependem sempre do médico.</footer>
<nav id="nav" style="display:none">
  <button data-t="inicio">Início</button>
  <button data-t="hoje">Registrar</button>
  <button data-t="plano">Plano</button>
  <button data-t="avaliacao">Avaliação</button>
  <button data-t="exames">Exames</button>
  <button data-t="emocional">Emocional</button>
  <button data-t="relatorio">Relatórios</button>
  <button data-t="admin" style="display:none">Admin</button>
</nav>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="ajuda.js"></script>
<script src="app.js"></script>
</body>
</html>
